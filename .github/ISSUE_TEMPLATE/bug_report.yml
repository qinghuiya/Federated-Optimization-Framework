name: Bug report
description: Report a reproducible framework problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal configuration
      render: yaml
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python, PyTorch, device, and traceback.
    validations:
      required: true

