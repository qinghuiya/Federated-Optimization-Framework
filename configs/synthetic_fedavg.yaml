experiment:
  seed: 0
  device: auto
  evaluate_every: 1
  verbose: true

data:
  name: synthetic
  samples: 2000
  features: 20
  classes: 4
  num_clients: 20
  batch_size: 32
  partition:
    name: dirichlet
    alpha: 0.5
    min_samples: 10

model:
  name: mlp
  hidden: 128

local:
  epochs: 1
  optimizer:
    name: sgd
    lr: 0.05
    momentum: 0.0

federated:
  algorithm: fedavg
  rounds: 20
  participation: 0.25
  server: {}

