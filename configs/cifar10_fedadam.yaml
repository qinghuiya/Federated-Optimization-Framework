experiment:
  seed: 0
  device: auto
  evaluate_every: 1
  verbose: true

data:
  name: cifar10
  root: data
  num_clients: 100
  batch_size: 32
  eval_batch_size: 256
  partition:
    name: dirichlet
    alpha: 0.5
    min_samples: 10

model:
  name: resnet18

local:
  epochs: 1
  optimizer:
    name: sgd
    lr: 0.05
    momentum: 0.9
    weight_decay: 0.0001

federated:
  algorithm: fedadam
  rounds: 100
  participation: 0.1
  server:
    server_lr: 0.01
    beta1: 0.9
    beta2: 0.99
    tau: 0.001

