experiment:
  seed: 0
  device: auto
  evaluate_every: 1
  verbose: true

data:
  name: synthetic
  samples: 2000
  features: 20
  classes: 4
  num_clients: 20
  batch_size: 32
  partition:
    name: dirichlet
    alpha: 0.1
    min_samples: 10

model:
  name: mlp

local:
  epochs: 2
  optimizer:
    name: momentum
    lr: 0.03

federated:
  algorithm: fedprox
  proximal_mu: 0.01
  rounds: 20
  participation: 0.25
  server: {}

